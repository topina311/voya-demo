<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Phuket Tours — Prototype</title>
<meta name="description" content="Voya Phuket Tours — discover, plan and book diving, island and show tours in Phuket, all in one place." />

<!-- PWA manifest — links installability / home-screen icon / standalone display. -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#FF385C" />

<!-- Icons — avoids Chrome's automatic /favicon.ico 404, and gives iOS Safari a
     home-screen icon (iOS ignores the web manifest for this). -->
<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="icon-192.png" />

<!-- Standalone/PWA behavior on iOS home-screen launches, matching the manifest's
     "display": "standalone" so mobile browsers behave consistently. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Voya" />

<style>
  html, body { margin: 0; padding: 0; background: #0b0b0c; height: 100%; }
  #root { min-height: 100vh; min-height: 100dvh; }
  @keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
</style>
</head>
<body>
<div id="root"></div>

          .iphone-btn { display: none; }

          .mock-status-bar { display: none; }

          /* No mock status bar on a real phone to clear, so bring Home's search
             pill up close to the true top edge instead of leaving that reserved
             desktop clearance empty \u2014 a small resting gap is enough. */
          .phone-mockup-bg { --search-pill-top: 14px; }

          /* Same for Planner/My Voya headers \u2014 no mock status bar to clear
             on a real phone, so the excess reserved space collapses to a tidy gap. */
          .phone-mockup-bg { --tab-header-top-pad: 12px; }

             Mobile Chrome/Safari only auto-hide their address bar in response to the
             real document scrolling \u2014 never a nested overflow:auto div. Every ancestor
             above a "doc-scroll" screen normally traps it in a fixed 100dvh box with
             overflow:hidden so it can manage its own internal scroll; the .doc-scroll
             variants here let that chain grow with content instead, so the browser
             window itself becomes the scroller. Applied only per-screen (via a
             conditional class) as each screen is migrated \u2014 screens not yet migrated
             keep the original fixed-viewport + internal-scroll behavior untouched. */

             tall content, but never collapses shorter than it on short-content tabs
             (e.g. Trips with no bookings yet) \u2014 screens-container is flex:1 (not
             flex:none) so it's the one that actually stretches to fill any leftover
             space, pushing bottom-nav down to sit flush with the true bottom edge
             instead of floating right under short content with a gap beneath it. */
          .app-shell.doc-scroll { height: auto; overflow: visible; min-height: 100vh; min-height: 100dvh; }
          .screens-container.doc-scroll { flex: 1; overflow: visible; }
          .screen-scroll.doc-scroll { height: auto; overflow-y: visible; }
          .bottom-nav.doc-scroll { position: sticky; }
          .planner-cta.doc-scroll { position: fixed; }

          /* \u2500\u2500 Moments \u2014 TikTok-style vertical snap feed \u2500\u2500
             Base (desktop / non-doc-scroll) keeps its own internal snap-scroll
             container unchanged. On mobile, the feed hands scrolling off to the real
             document like every other tab, but must keep the snap-per-card feel \u2014
             scroll-snap-type moves from the (now non-scrolling) feed div onto <html>
             itself, since that's the actual scrolling box once every ancestor is

             full-screen pages. The category-tab bar switches from floating
             position:absolute (which would now scroll away with the feed) to
             position:sticky so it stays pinned exactly as before. */

          .moments-root.doc-scroll { position: relative; inset: auto; min-height: 100vh; min-height: 100dvh; }

          .moments-subtabs.doc-scroll { position: sticky; }
          .moments-feed.doc-scroll { position: relative; inset: auto; height: auto; overflow-y: visible; scroll-snap-type: none; }
