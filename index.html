<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Phuket Tours — Prototype</title>
<meta name="description" content="Voya Phuket Tours — discover, plan and book diving, island and show tours in Phuket, all in one place." />

<!-- PWA manifest — links installability / home-screen icon / standalone display. -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#FF385C" />

<!-- Icons — avoids Chrome's automatic /favicon.ico 404, and gives iOS Safari a
     home-screen icon (iOS ignores the web manifest for this). -->
<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="icon-192.png" />

<!-- Standalone/PWA behavior on iOS home-screen launches, matching the manifest's
     "display": "standalone" so mobile browsers behave consistently. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Voya" />

<style>
  html, body { margin: 0; padding: 0; background: #0b0b0c; height: 100%; }
  #root { min-height: 100vh; min-height: 100dvh; }
  @keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
</style>
</head>
<body>
<div id="root"></div>

        .hide-scroll::-webkit-scrollbar { display: none; }

        /* \u2500\u2500 Global micro-interactions \u2500\u2500

           taps feel like they physically depress. Kept subtle (0.96) and fast in,
           slower out, which reads as responsive rather than springy. Buttons opt
           OUT via .no-press where a scale would look wrong (full-bleed cards,
           icon-only overlays on media, drag handles). */
        button { transition: transform 0.16s cubic-bezier(0.2, 0, 0, 1), opacity 0.16s ease, background 0.2s ease; }
        button:active:not(:disabled):not(.no-press) { transform: scale(0.96); }
        button:disabled { cursor: not-allowed; }

        /* Larger tap targets get a gentler ratio \u2014 0.96 on a full-width CTA is a
           lot of travel, so scale it down proportionally instead. */
        .press-soft:active:not(:disabled) { transform: scale(0.985) !important; }

        /* Tappable non-button surfaces (tour cards, list rows) get the same feel. */
        .tap-card { transition: transform 0.16s cubic-bezier(0.2, 0, 0, 1); }

           in the display sizes. */
        body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

          .press-soft:active:not(:disabled),
          .tap-card:active { transform: none !important; }
          * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }

        @keyframes slideUpScreen {
          from { transform: translateY(100%); }
          to   { transform: translateY(0); }
        }
        @keyframes slideDownScreen {
          from { transform: translateY(0); }
          to   { transform: translateY(100%); }
        }
        @keyframes scrimIn {
          from { opacity: 0; }
          to   { opacity: 1; }

        @keyframes scrimOut {
          from { opacity: 1; }

        @keyframes momentFadeIn {

        @keyframes momentShimmer {

        .iphone-btn-vol-up  { left: -3px; top: 196px; width: 3px; height: 46px; border-radius: 3px 0 0 3px; }
        .iphone-btn-vol-down{ left: -3px; top: 254px; width: 3px; height: 46px; border-radius: 3px 0 0 3px; }
        .iphone-btn-power   { right: -3px; top: 210px; width: 3px; height: 84px; border-radius: 0 3px 3px 0; }
