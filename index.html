<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Phuket Tours — Prototype</title>
<meta name="description" content="Voya Phuket Tours — discover, plan and book diving, island and show tours in Phuket, all in one place." />

<!-- PWA manifest — links installability / home-screen icon / standalone display. -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#FF385C" />

<!-- Icons — avoids Chrome's automatic /favicon.ico 404, and gives iOS Safari a
     home-screen icon (iOS ignores the web manifest for this). -->
<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="icon-192.png" />

<!-- Standalone/PWA behavior on iOS home-screen launches, matching the manifest's
     "display": "standalone" so mobile browsers behave consistently. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Voya" />

<style>
  html, body { margin: 0; padding: 0; background: #0b0b0c; height: 100%; }
  #root { min-height: 100vh; min-height: 100dvh; }
</style>
</head>
