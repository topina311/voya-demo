  const state = new WeakMap();
  const css = `.pt-gallery-dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:5px;z-index:30;pointer-events:auto}.pt-gallery-dots button{width:6px;height:6px;border-radius:999px;border:0;padding:0;background:rgba(255,255,255,.55);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:width .22s ease,background .22s ease,transform .16s ease;cursor:pointer}.pt-gallery-dots button.is-active{width:22px;background:#fff}.pt-gallery-dots button:active{transform:scale(.88)}.pt-gallery-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:31;width:34px;height:44px;border:0;border-radius:999px;background:rgba(0,0,0,.28);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;line-height:1;font-weight:300;cursor:pointer;opacity:0;transition:opacity .18s ease,background .18s ease,transform .16s ease;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.pt-gallery-nav.left{left:10px}.pt-gallery-nav.right{right:10px}.pt-gallery-nav:active{transform:translateY(-50%) scale(.92);background:rgba(0,0,0,.42)}*:hover>.pt-gallery-nav,.pt-gallery-nav:focus-visible{opacity:1}@media (hover:none){.pt-gallery-nav{opacity:.82;width:32px;height:42px;font-size:24px;background:rgba(0,0,0,.18)}}img[data-pt-gallery]{transition:opacity .18s ease, transform .24s cubic-bezier(.32,.72,0,1);will-change:opacity,transform}`;
  if(!document.getElementById('pt-gallery-style')){const st=document.createElement('style');st.id='pt-gallery-style';st.textContent=css;document.head.appendChild(st);}
  const setImage=(img,i,animate=true)=>{
    const arr=galleries[img.alt]; if(!arr) return;
    const s=state.get(img)||{i:0,startX:null,swiped:false}; s.i=((i%arr.length)+arr.length)%arr.length; state.set(img,s);
    img.onerror=()=>{const st=state.get(img)||s;st.fail=(st.fail||0)+1;if(st.fail<arr.length){st.i=(st.i+1)%arr.length;img.src=arr[st.i];}else{img.onerror=null;img.style.background='#f2f2f4';}};
    if(animate){img.style.opacity='.35';img.style.transform='scale(1.015)';setTimeout(()=>{img.src=arr[s.i];img.style.opacity='1';img.style.transform='scale(1)';},80);} else img.src=arr[s.i];
    const host=img.parentElement; if(host) host.querySelectorAll('.pt-gallery-dots button').forEach((b,idx)=>b.classList.toggle('is-active',idx===s.i));
  };
  const ensureDots=(img)=>{
    const arr=galleries[img.alt], host=img.parentElement; if(!arr||!host||host.querySelector('.pt-gallery-dots')) return;
    if(getComputedStyle(host).position==='static') host.style.position='relative';
    Array.from(host.children).forEach(ch=>{if(ch!==img&&ch.children&&ch.children.length===5&&!ch.classList.contains('pt-gallery-dots')) ch.style.display='none';});
    const dots=document.createElement('div');dots.className='pt-gallery-dots';

    if(!host.querySelector('.pt-gallery-nav')){['left','right'].forEach(dir=>{const nb=document.createElement('button');nb.type='button';nb.className='pt-gallery-nav '+dir;nb.innerHTML=dir==='left'?'‹':'›';nb.setAttribute('aria-label',dir==='left'?`Previous photo for ${img.alt}`:`Next photo for ${img.alt}`);nb.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();const st=state.get(img)||{i:0};setImage(img,st.i+(dir==='left'?-1:1),true);},true);host.appendChild(nb);});}
  };
  const wire=(img)=>{
    if(!galleries[img.alt]||img.dataset.ptGallery==='1') return;
    const firstHost=img.parentElement;
    const isHeroCarousel=firstHost&&Array.from(firstHost.children).filter(ch=>ch.tagName==='IMG'&&galleries[ch.alt]).length>1;
    if(isHeroCarousel) return;
    const box=img.getBoundingClientRect();
    const isSmallThumbnail=(box.width&&box.width<90)||(box.height&&box.height<90);
    if(isSmallThumbnail) return;
    img.dataset.ptGallery='1'; img.loading='lazy'; state.set(img,{i:0,startX:null,swiped:false}); setImage(img,0,false); ensureDots(img);

    "Simon Cabaret":   {t:"Free cancellation", c:"#059669"},
    "Fantasea Show":   {t:"Kids love it", c:"#7C3AED"},
    "Fire Show":       {t:"Free cancellation", c:"#059669"},
    "Siam Niramit":    {t:"Cultural icon", c:"#7C3AED"},
    "Muay Thai Night": {t:"Live fights", c:"#DC2626"}
  };
  const anchorMult = 1.33; // old price = current * 1.33 (anchoring)

  const style = document.createElement('style');
  style.textContent = `
    .vyg-badge{position:absolute;top:12px;left:12px;z-index:5;color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:4px 9px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25);max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .vyg-old{text-decoration:line-through;color:#9CA3AF;font-size:11px;font-weight:500;margin-right:4px}
    .vyg-booked{position:absolute;bottom:10px;left:12px;z-index:5;color:#fff;font-size:10px;font-weight:600;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);padding:3px 8px;border-radius:999px}
    .vyg-stick{bottom:0;left:0;right:0}
  `;
  document.head.appendChild(style);

  // ---------- NAV AUTO HIDE (scroll down hides, scroll up shows) ----------
  let navEl = null, lastY = 0, hidden = false;
  const findNav = () => {
    if (navEl) return navEl;
    const all = [...document.querySelectorAll('div')];
    navEl = all.find(d => { const cs = getComputedStyle(d); return cs.position === 'fixed' && cs.bottom === '0px' && d.offsetHeight > 40 && d.offsetHeight < 120 && d.children.length >= 4; });
    if (navEl) { navEl.style.transition = 'transform .25s ease'; navEl.style.willChange = 'transform'; }
    return navEl;
  };

  const applyNav = () => {
    const n = findNav();
    if (!n) return;
    // find active scroll container
    const scroller = [...document.querySelectorAll('.hide-scroll')].find(s => s.scrollHeight > s.clientHeight + 60 && s.getBoundingClientRect().height > 300) || null;
    if (!scroller) return;
    const y = scroller.scrollTop;
    const delta = y - lastY;
    if (y < 40) { if (hidden) { n.style.transform = 'translateY(0)'; hidden = false; } lastY = y; return; }
    if (delta > 6 && !hidden) { n.style.transform = 'translateY(105%)'; hidden = true; }
    else if (delta < -6 && hidden) { n.style.transform = 'translateY(0)'; hidden = false; }
    lastY = y;
  };

  document.addEventListener('scroll', applyNav, {passive:true, capture:true});

  // ---------- BADGES + OLD PRICE on cards ----------
  const apply = () => {
    // find all tour cards in search list: containers with role=button + img + price text "฿"
    const cards = [...document.querySelectorAll('div[role="button"]')].filter(c => {
      const t = c.textContent || '';
      return t.includes('฿') && c.querySelector('img') && c.querySelector('img').alt;
    });
    cards.forEach(card => {
      if (card.dataset.vygDone) return;
      const img = card.querySelector('img');
      const name = img.alt;
      const b = badges[name];
      const imgWrap = card.querySelector('div') && card.querySelector('div').style && getComputedStyle(card.querySelector('div')).position === 'relative' ? card.querySelector('div') : null;
      // find the image's relative parent (has height 240)
      let holder = img.parentElement;
      while (holder && getComputedStyle(holder).position !== 'relative' && holder !== card) holder = holder.parentElement;
      if (b && holder) {
        const el = document.createElement('span');
        el.className = 'vyg-badge';
        el.textContent = b.t;
        el.style.background = b.c;
        holder.appendChild(el);
        card.dataset.vygDone = '1';
      }
      // old price: find the price div (contains ฿), add strikethrough sibling
      const priceEls = [...card.querySelectorAll('div')].filter(d => d.textContent.includes('฿') && d.children.length === 0 && d.textContent.trim().length < 12);
      if (priceEls.length && !card.dataset.vygPrice) {
        const pe = priceEls[priceEls.length - 1];
        const m = pe.textContent.match(/([\d,]+)/);
        if (m) {
          const cur = parseInt(m[1].replace(/,/g,''), 10);
          const old = Math.round(cur * anchorMult / 50) * 50;
          const oldEl = document.createElement('span');
          oldEl.className = 'vyg-old';
          oldEl.textContent = '฿' + old.toLocaleString();
          const parent = pe.parentElement;
          if (parent && parent.children.length <= 2) {
            parent.insertBefore(oldEl, pe);
            card.dataset.vygPrice = '1';
          }
        }
      }
    });
    // "Booked X today" chips on moments feed cards
    document.querySelectorAll('img[alt]').forEach(img => {
      if (img.dataset.vygBooked || !img.alt) return;
      const n = img.alt;
      if (badges[n] && img.parentElement && img.parentElement.style && getComputedStyle(img.parentElement).position === 'relative') {
        const holder = img.parentElement;
        if (holder.querySelector('.vyg-booked')) return;
        const counts = {"Phi Phi Islands": 12, "James Bond Island": 9, "Maya Bay": 11, "Similan Islands": 7, "Yona Beach Club": 15, "Fantasea Show": 8};
        if (counts[n]) {
          const el = document.createElement('span');
          el.className = 'vyg-booked';
          el.textContent = 'Booked ' + counts[n] + '× today';
          holder.appendChild(el);
          img.dataset.vygBooked = '1';
        }
      }
    });
  };

  const ro = new MutationObserver(apply);
  ro.observe(document.body, {childList:true, subtree:true});
  setInterval(apply, 1500);
  setTimeout(apply, 800);
})();
</script>
<script id="voya-foundation">
(() => {
  const style = document.createElement('style');
  style.textContent = `
    /* ============ FOUNDATION: real webpage, not a phone mockup ============ */
    /* 1. strip mockup chrome everywhere (real browser has its own status bar) */
    .mock-status-bar, .iphone-btn, .iphone-btn-action, .iphone-btn-vol-up, .iphone-btn-vol-down, .iphone-btn-power {
      display: none !important;
    }
    html, body {
      height: auto !important;
      min-height: 100dvh !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      background: #F7F7F8 !important;
      overscroll-behavior-y: none;
    }
    /* 2. document scrolling: convert inner scroll containers to natural flow
          so the mobile browser URL bar collapses on scroll (like GYG) */
    @media (max-width: 767px) {
      .hide-scroll { padding: 12px 14px 100px !important; }
      .hide-scroll > div { margin-top: 14px !important; }
      /* feed hero cards: reduce 78vh full-screen to a compact card on mobile */
      div[style*="78vh"], div[style*="78vh"] { height: auto !important; min-height: 420px !important; max-height: 480px !important; }
      .hide-scroll > div > div > div > div { }
    }
    .iphone-frame, .iphone-screen-outer, .iphone-app-area,
    .iphone-app-area > div, .iphone-app-area > div > div,
    .iphone-app-area .hide-scroll {
      height: auto !important;
      min-height: 100dvh !important;
      overflow: visible !important;
      max-width: none !important;
      width: 100% !important;
      border-radius: 0 !important;
      background: transparent !important;
    }
    /* keep the real app surface white */
    .iphone-app-area { background: #F7F7F8 !important; }
    /* search bar full-width white bar: fill the sides like GYG (wrapper + its padding div) */
    div[style*="position: fixed"][style*="top: 0"] > div,
    div[style*="position:fixed"][style*="top: 0"] > div {
      background: #ffffff !important;
    }
    /* EXEMPT the fixed bottom nav from the 100dvh min-height leak AND force white bg (mobile + desktop) */
    .iphone-app-area > div > div[style*="position: fixed"],
    .iphone-app-area > div > div[style*="position:fixed"],
    .iphone-app-area > div > div > div[style*="position: fixed"],
    .iphone-app-area > div > div > div[style*="position:fixed"] {
      height: auto !important;
      min-height: 0 !important;
      max-height: none !important;
      flex: none !important;
      background: #ffffff !important;
    }
    /* inner nav row also white (covers the transparent-leak on children) */
    .iphone-app-area > div > div[style*="position: fixed"] > div,
    .iphone-app-area > div > div > div[style*="position: fixed"] > div {
      background: #ffffff !important;
    }
    /* 3. sticky search bar: sit at the very top on mobile (safe-area aware) */
    .vyg-search-pill { box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.08) !important; }
    /* 4. desktop layout (GYG style) */
    @media (min-width: 768px) {
      .iphone-app-area .hide-scroll {
        max-width: 1180px !important;
        margin: 0 auto !important;
        padding: 24px !important;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }
      /* feed hero cards -> 2-col grid on desktop */
      .hide-scroll > div { width: 100% !important; }
      /* undo min-height leak on the fixed bottom nav (higher specificity than the 100dvh rule) */
      .iphone-app-area > div > div[style*="position: fixed"],
      .iphone-app-area > div > div[style*="position:fixed"],
      div[style*="position: fixed"][style*="bottom: 0px"],
      div[style*="position:fixed"][style*="bottom: 0px"] {
        min-height: 0 !important;
        height: auto !important;
        max-height: none !important;
        flex: none !important;
      }
      /* bottom nav: solid white bar full width at bottom (like GYG desktop footer nav) */
      .iphone-app-area + div, div[style*="position:fixed"] {
        max-width: none !important;
        left: 0 !important;
        right: 0 !important;
        transform: none !important;
        border-radius: 0 !important;
        background: #fff !important;
        border-top: 1px solid #E5E7EB !important;
        box-shadow: 0 -2px 12px rgba(0,0,0,.04) !important;
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
      }
      /* inner nav row: natural height, centered content */
      div[style*="position:fixed"] > div {
        height: auto !important;
        min-height: 0 !important;
        padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px)) !important;
      }
      /* content wrapper: centered column, comfortable width */
      .iphone-app-area .hide-scroll {
        max-width: 1180px !important;
        margin: 0 auto !important;
        padding: 16px 16px 110px !important;
      }
      /* hero/feed full-screen cards -> 2-column grid on desktop */
      .hide-scroll > div {
        display: grid !important;
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 16px !important;
      }
      .hide-scroll > div > * { min-width: 0 !important; }
    }
  `;
  document.head.appendChild(style);

  // -------- search bar: pin to top on scroll (robust, both mobile & desktop) --------
  let pinned = false;
  const pinSearch = () => {
    const pill = document.querySelector('.vyg-search-pill');
    if (!pill) return;
    const stickyWrap = pill.closest('[style*="position:sticky"], [style*="position: sticky"]') || pill.parentElement.parentElement.parentElement;
    const shouldPin = window.scrollY > 60;
    if (shouldPin && !pinned) {
      if (stickyWrap) stickyWrap.style.position = 'fixed';
      stickyWrap.style.top = '0';
      stickyWrap.style.left = '0';
      stickyWrap.style.right = '0';
      stickyWrap.style.zIndex = '100';
      stickyWrap.style.height = 'auto';
      pill.style.boxShadow = '0 4px 16px rgba(0,0,0,.08)';
      pinned = true;
    } else if (!shouldPin && pinned) {
      if (stickyWrap) stickyWrap.style.position = '';
      stickyWrap.style.top = '';
      stickyWrap.style.left = '';
      stickyWrap.style.right = '';
      stickyWrap.style.zIndex = '';
      stickyWrap.style.height = '';
      pill.style.boxShadow = '';
      pinned = false;
    }
  };
  window.addEventListener('scroll', pinSearch, {passive:true});
  setTimeout(pinSearch, 1500);



  // -------- desktop: turn horizontal card rows into wrapping grids --------
  const apply = () => {
    if (window.innerWidth < 768) return;
    document.querySelectorAll('.hide-scroll > div').forEach(row => {
      const cs = getComputedStyle(row);
      // horizontal rows (overflow-x) become wrapping grids
      if (cs.overflowX === 'auto' || cs.overflowX === 'scroll') {
        row.style.overflowX = 'visible';
        row.style.flexWrap = 'wrap';
        row.style.gap = '16px';
        [...row.children].forEach(c => {
          if (c.style) { c.style.flex = '1 1 240px'; c.style.maxWidth = '360px'; }
        });
      }
    });
  };
  const ro = new MutationObserver(apply);
  ro.observe(document.body, {childList:true, subtree:true});
  window.addEventListener('resize', apply);
  setTimeout(apply, 1200);
  setTimeout(apply, 3000);
})();
</script>
<script id="voya-gyg-search">
(() => {
  const style = document.createElement('style');
  style.textContent = `
    .vyg-search-pill{display:flex !important;align-items:center !important;gap:10px !important;padding:13px 16px !important;border-radius:999px !important;background:#fff !important;border:1px solid #E5E7EB !important;box-shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.08) !important;cursor:pointer !important;transition:box-shadow .2s ease !important;}
    .vyg-search-pill:active{box-shadow:0 1px 2px rgba(0,0,0,.05), 0 2px 6px rgba(0,0,0,.08) !important;}
    .vyg-search-text{flex:1 !important;font-size:14px !important;font-weight:500 !important;color:#6B7280 !important;white-space:nowrap !important;overflow:hidden !important;text-overflow:ellipsis !important;background:none !important;border:none !important;text-align:left !important;padding:0 !important;line-height:1.3 !important;}
  `;
  document.head.appendChild(style);

  const apply = () => {
    // find the search pill: container div with borderRadius full containing "Where to?"
    const all = [...document.querySelectorAll('div')];
    const pill = all.find(d => {
      const cs = getComputedStyle(d);
      const t = d.textContent || '';
      return cs.display === 'flex' && (cs.borderRadius === '999px' || cs.borderRadius.includes('50%') === false) && t.includes('Where to?') && t.length < 120 && d.children.length >= 3 && d.querySelector('input') === null;
    });
    if (!pill || pill.dataset.vygSearch) return;

    // keep the click handler: find the "Where to?" button inside and clone its onClick behavior by re-wiring a new element
    const whereBtn = [...pill.querySelectorAll('button')].find(b => b.textContent.includes('Where to?'));
    const magnifier = document.createElement('span');
    magnifier.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
    magnifier.style.cssText = 'flex-shrink:0;display:flex;';

    const textEl = document.createElement('span');
    textEl.className = 'vyg-search-text';
    textEl.textContent = 'Find places and things to do';

    // rebuild pill
    pill.innerHTML = '';
    pill.classList.add('vyg-search-pill');
    pill.appendChild(magnifier);
    pill.appendChild(textEl);
    pill.dataset.vygSearch = '1';

    // rewire click: pill click triggers same action as where button
    if (whereBtn) {
      const clone = whereBtn.cloneNode(true);
      // attach click on pill itself by simulating the original button's handler
      pill.addEventListener('click', (ev) => {
        const target = clone;
        // trigger any react handler: click the original hidden button
        whereBtn.click();
      });
    }
  };

  const ro = new MutationObserver(apply);
  ro.observe(document.body, {childList:true, subtree:true});
  setTimeout(apply, 900);
  setTimeout(apply, 2500);
})();
</script>
<script id="voya-gyg-header">

    if (document.getElementById(INJ)) return;
    var pillWrap = null;
    // find the search pill container (rounded full, contains "Find places and things to do")
    var all = document.querySelectorAll('div');
    for (var i=0;i<all.length;i++){
      var d = all[i];
      if (!d.querySelector) continue;
      var t = d.textContent || '';
      if (t.indexOf('Find places and things to do') !== -1 && (d.style.borderRadius || '').indexOf('9999') !== -1 && d.children.length > 1){
        // climb to the fixed white bar that hosts it
        var p = d.parentElement;
        while (p && getComputedStyle(p).position !== 'fixed') p = p.parentElement;
        if (p) { pillWrap = p; break; }

          '<div style="position:relative">' +
            '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="'+ink+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>' +
            '<div style="position:absolute;top:-4px;right:-6px;min-width:16px;height:16px;border-radius:8px;background:#E0354B;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px">1</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<h1 style="font-size:24px;font-weight:700;color:'+ink+';line-height:1.25;margin:2px 2px 12px;letter-spacing:-0.3px">Experiences worth<br>travelling for</h1>';
    // insert at top of the fixed white bar
    pillWrap.insertBefore(bar, pillWrap.firstChild);
  }
  var mo = new MutationObserver(inject);
  mo.observe(document.body, {childList:true, subtree:true});
  setTimeout(inject, 800);
  setTimeout(inject, 1800);
  // force the fixed host bar flush to the very top edge (no gap below browser chrome)
  var st = document.createElement('style');
  st.textContent = 'div[style*="position: fixed"][style*="top: 0"]{top:0px !important; z-index:9999 !important; background:#ffffff !important;} div[style*="position: fixed"][style*="top: 0"] *{background-color:transparent;} div[style*="position: fixed"][style*="top: 0"] > div{background-color:#ffffff !important;} .iphone-app-area > div > div:not([style*="position: fixed"]){z-index:1 !important;} .iphone-app-area img{position:relative; z-index:0 !important;} .hide-scroll > div > div{position:relative; z-index:0 !important;} .iphone-screen-outer{transform:none !important;} .iphone-frame{transform:none !important;} .phone-mockup-bg{transform:none !important;}';
  document.head.appendChild(st);
})();
